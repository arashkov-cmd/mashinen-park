<!doctype html>
<html lang="bg">
<head>

<style>
:root{
  --bg:#eceff2; --surface:#ffffff; --ink:#16202a; --muted:#5a6672; --line:#d3d9df;
  --accent:#e5a00d; --accent-ink:#1d1500; --accent-soft:#fbefd2;
  --ok:#1d7f47; --ok-soft:#dcf1e4; --warn:#b86a00; --warn-soft:#fbe9cf; --bad:#c22b2b; --bad-soft:#f8dddd;
  --f-display:"Oswald","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151a; --surface:#1a2128; --ink:#e5e9ed; --muted:#93a0ac; --line:#2b343d;
  --accent:#f0b429; --accent-ink:#1d1500; --accent-soft:#3a2f12;
  --ok:#43c07a; --ok-soft:#173726; --warn:#eaa443; --warn-soft:#3b2b12; --bad:#f0625f; --bad-soft:#3d1c1c; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:1.35rem}
h3{font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:10px}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-size:1.2rem;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{display:inline-block;width:12px;height:12px;background:var(--accent);transform:rotate(45deg)}
.who{margin-left:auto;text-align:right;font-size:.8rem;line-height:1.2;min-width:0}
.who .wr{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal}
.who b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);border-radius:8px;padding:8px 10px;font:inherit;font-size:.85rem;cursor:pointer;display:flex;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer;flex-wrap:wrap}
.row:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-family:var(--f-mono);font-weight:700;font-size:1rem;background:var(--accent-soft);color:var(--ink);padding:4px 8px;border-radius:6px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.c-bad{background:var(--bad-soft);color:var(--bad)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-ok{background:var(--ok-soft);color:var(--ok)} .c-n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
label{font-size:.85rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,select,textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
textarea{min-height:96px;resize:vertical}
.big-in{font-family:var(--f-mono);font-size:1.6rem;font-weight:700;letter-spacing:.02em}
.btn{font:inherit;font-weight:600;font-size:1rem;min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 16px;cursor:pointer;width:100%}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:40px;font-size:.9rem;padding:8px 12px;width:auto}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.seg{display:flex;flex-direction:column;gap:6px}
.seg label{flex-direction:row;align-items:center;gap:10px;font-size:1rem;color:var(--ink);font-weight:500;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.seg input{width:auto;margin:0;accent-color:var(--accent)}
.err{color:var(--bad);font-weight:600;font-size:.9rem}
.err:empty{display:none}
.mhead{display:flex;flex-direction:column;gap:6px}
.mnum{font-family:var(--f-mono);font-size:2rem;font-weight:700;line-height:1}
.meter{display:flex;align-items:baseline;gap:8px;background:var(--ink);color:var(--bg);border-radius:10px;padding:12px 14px}
.meter .v{font-family:var(--f-mono);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.meter .u{font-size:.9rem;opacity:.8}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.ev{border-left:3px solid var(--line);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:4px}
.ev.bad{border-color:var(--bad)} .ev.warn{border-color:var(--warn)} .ev.ok{border-color:var(--ok)}
.ev .h{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.photo{max-width:100%;border-radius:8px;border:1px solid var(--line);max-height:260px;object-fit:cover;display:block}
details.grp{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.grp summary{list-style:none;padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;font-family:var(--f-display);font-size:1.1rem}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary .cnt{margin-left:auto;font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
details.grp .list{padding:0 10px 10px}
details.grp .row{border-color:transparent;background:var(--bg)}
.shift{background:var(--ink);color:var(--bg);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.shift .lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.shift .mnum{color:var(--accent)}
.login{min-height:100vh;display:flex;flex-direction:column}
.login .hero{background:var(--ink);color:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(32px,env(safe-area-inset-top,0px));padding-bottom:24px}
.login .hero-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.login h1{font-size:2.2rem;text-transform:uppercase;letter-spacing:.03em}
.stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--accent) 0 14px,var(--ink) 14px 28px)}
.login .wrap{max-width:480px}
.dots{display:flex;gap:14px;justify-content:center;padding:8px 0}
.dots span{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink)}
.dots span.on{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{font-family:var(--f-mono);font-size:1.6rem;font-weight:700;min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.pad button.fn{font-family:var(--f-body);font-size:.95rem;font-weight:600;color:var(--muted)}
.combo{position:relative}
.combo input{padding-right:56px;font-size:1.1rem;min-height:56px}
.combo-btn{position:absolute;top:0;right:0;height:56px;width:52px;background:none;border:0;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.drop{margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:320px;overflow-y:auto;box-shadow:0 8px 24px rgb(0 0 0 / .12)}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;font:inherit;color:inherit;cursor:pointer;min-height:56px}
.opt:last-child{border-bottom:0}
.opt .t{font-weight:600;font-size:1.05rem}.opt .s{font-size:.8rem;color:var(--muted)}
.opt:active,.opt:hover{background:var(--accent-soft)}
.demo{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:.875rem}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav-in{max-width:680px;margin:0 auto;display:flex}
.nav button{flex:1;background:none;border:0;font:inherit;font-size:.8rem;font-weight:600;color:var(--muted);padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative}
.nav button.on{color:var(--ink)}
.nav button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.nav svg{width:24px;height:24px}
.nav .badge{position:absolute;top:4px;right:calc(50% - 22px);background:var(--bad);color:#fff;font-size:.7rem;border-radius:999px;padding:1px 6px;font-family:var(--f-mono)}
.wait{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:31;background:var(--accent);color:var(--accent-ink);padding:14px 16px;border-radius:12px;font-weight:700;text-align:center;box-shadow:0 6px 20px rgb(0 0 0 / .25)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgb(0 0 0 / .25)}
.back{background:none;border:0;font:inherit;font-weight:600;color:var(--muted);padding:4px 0;cursor:pointer;align-self:flex-start}
.empty{color:var(--muted);font-size:.95rem;padding:4px 0}
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
/* loading bar */
#busy{position:fixed;top:0;left:0;right:0;height:4px;z-index:30;overflow:hidden;background:color-mix(in srgb,var(--accent) 25%,transparent)}
#busy::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;background:var(--accent);animation:bar 1s ease-in-out infinite}
@keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
body.busy .btn,body.busy .pad button,body.busy .row{opacity:.6;pointer-events:none}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){.row,.btn,.pad button{transition:transform .08s}.row:active,.btn:active,.pad button:active{transform:scale(.98)}}

/* iPhone: рамката на Google не бива да става по-широка от екрана */
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{overflow-wrap:anywhere;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#app,.wrap,.top-in,.card,.list,.btns,.login,.hero-in{min-width:0;max-width:100%}
.wrap{width:100%}
input,select,textarea{min-width:0;max-width:100%}
.pad{grid-template-columns:repeat(3,minmax(0,1fr))}
.btns .btn{min-width:0}
.row,.mcard,.kv dd,.ev{min-width:0}
.num,.chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}
#busy{contain:paint}
.top button,.btn,.pad button,.nav button{overflow-wrap:normal}
.top button{flex-shrink:0;white-space:nowrap}
.brand{flex-shrink:0}
.who{flex:1 1 auto}
@media (max-width:374px){.top .bt{display:none}.top-in{gap:6px}.top button{padding:7px 8px}}
.alert{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:12px 14px;font-weight:600}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:14px;font-weight:600}
.mcard{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.mcard .mnum{font-size:1.6rem}
.numin{font-family:var(--f-mono);font-size:2rem;font-weight:700;letter-spacing:.12em;text-align:center}
.sumline{display:flex;flex-wrap:wrap;gap:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.sh{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.sh:last-child{border-bottom:0}
.sgrps{display:flex;flex-direction:column;gap:8px}
details.sgrp summary{flex-direction:column;align-items:stretch;gap:8px}
.sg-top{display:flex;align-items:center;gap:10px}.sg-top .cnt{margin-left:auto;font-family:var(--f-mono);font-size:.9rem;color:var(--muted)}
.sg-top::after{content:"▾";color:var(--muted);font-size:.9rem}details[open] .sg-top::after{content:"▴"}
details.sgrp .sumline .chip{font-family:var(--f-body);font-size:.8rem;font-weight:500}
.sg-type{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 16px 4px}
.sgrp-empty{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:.95rem}
.sgrp-empty .cnt{font-size:.85rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:inherit;color:var(--ink);cursor:pointer;text-align:left;min-width:0}
.tile .tn{font-family:var(--f-mono);font-size:2rem;font-weight:700;line-height:1.1}
.tile .tl{font-weight:600;color:var(--muted)}
.tile.t-warn{border-color:var(--warn);background:var(--warn-soft)}.tile.t-warn .tn,.tile.t-warn .tl{color:var(--warn)}
.tile.t-bad{border-color:var(--bad);background:var(--bad-soft)}.tile.t-bad .tn,.tile.t-bad .tl{color:var(--bad)}
.segbar{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.segbar button{font:inherit;font-weight:600;border:0;border-radius:9px;padding:12px 8px;background:none;color:var(--muted);cursor:pointer;min-width:0}
.segbar button.on{background:var(--ink);color:var(--bg)}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:10px}
.fcard>.row{border-color:transparent;background:var(--bg)}
.fcard .ev{margin:0 6px 4px}
.rday{display:flex;flex-direction:column;gap:8px;padding:6px 0 10px;border-bottom:1px solid var(--line)}
.rday:last-child{border-bottom:0}
.rdh{font-family:var(--f-display);font-size:1.05rem;letter-spacing:.02em}
.sh .d{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.sh .w{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh .v{grid-column:2/4;font-family:var(--f-mono);font-size:.85rem}
.sh .x{font-size:.75rem;color:var(--muted);grid-column:2/4}
</style>

<body>
<div id="busy" hidden></div>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<div id="wait" class="wait" role="status" hidden></div>

<script>
/* ===== АДРЕС НА СЪРВЪРА =====
   Сложи тук адреса от Apps Script → Внедряване → Управление на внедряванията (завършва на /exec). */
const API='https://script.google.com/macros/s/AKfycbziRhvT6ub_yFVhW6YJGPsY2dFaMTtLLZjrHMb8f8wMboKATxmxttxNKgy6FslPszs0Gg/exec';
const KEY='mashinen-park-g2';
const POLL_MS=60000;
const SVC_EVERY=500, SVC_WARN=50; // обслужване на всеки 500 мч, предупреждение 50 мч по-рано
const DCLS={'повредена':'c-bad','в ремонт':'c-warn','поправена':'c-ok'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const fmt=t=>{const d=new Date(t);return `${pad2(d.getDate())}.${pad2(d.getMonth()+1)}.${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`};
const fmtD=t=>{const d=new Date(t);return `${pad2(d.getDate())}.${pad2(d.getMonth()+1)}.${d.getFullYear()}`};
const fmtT=t=>{const d=new Date(t);return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`};
const iso=t=>{const d=t?new Date(t):new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`};
const nf=n=>n==null?'—':Number(n).toLocaleString('bg-BG');
const unitL=u=>u==='км'?'километра':'моточаса';
const unitIn=u=>u==='км'?'Километраж':'Моточасове';
const stChip=s=>s==='спряна'?'<span class="chip c-bad">спряна</span>':'<span class="chip c-ok">работи</span>';

let db=null, me=null, pin=null, loadErr='';
let view={n:'home'}, entry='', op={q:'',repair:false,done:null}, confirmKey=null, busy=false, seq=0, allShifts={}, allMoves={}, loadingShifts={};
const SH_PAGE=30;
try{pin=localStorage.getItem(KEY+'-pin')}catch(e){}
function savePin(){try{pin?localStorage.setItem(KEY+'-pin',pin):localStorage.removeItem(KEY+'-pin')}catch(e){}}
/* Последните данни се пазят на телефона, за да се покаже екранът веднага при отваряне (без ПИН-овете на хората). */
function saveCache(){try{if(!db){localStorage.removeItem(KEY+'-db');return}
  const c=Object.assign({},db);if(c.users)c.users=c.users.map(u=>({id:u.id,name:u.name,role:u.role}));
  localStorage.setItem(KEY+'-db',JSON.stringify(c))}catch(e){}}
function loadCache(){try{const c=JSON.parse(localStorage.getItem(KEY+'-db')||'null');return c&&c.me&&Array.isArray(c.machines)?c:null}catch(e){return null}}
function setDb(r){db=r;me=r.me;saveCache()}

const M=id=>db.machines.find(m=>m.id===id);
const byNum=n=>db.machines.find(m=>m.num===String(n).trim());
const openShiftOn=mid=>db.shifts.find(s=>s.machineId===mid&&s.endAt==null);
const isA=()=>me&&me.role==='администратор';
function svc(m){
  if(m.unit!=='мч')return null;
  const last=db.repairs.filter(r=>r.machineId===m.id&&r.kind==='обслужване'&&r.val!=null).sort((a,b)=>b.val-a.val)[0];
  if(!last)return {none:true};
  const next=last.val+SVC_EVERY,left=Math.round((next-(m.val||0))*10)/10;
  return {last,next,left,due:left<=SVC_WARN,over:left<0};
}
function svcChip(m){
  const s=svc(m);if(!s||s.none||!s.due)return '';
  return s.over?`<span class="chip c-bad">обсл. просрочено ${nf(-s.left)} мч</span>`:`<span class="chip c-warn">обсл. след ${nf(s.left)} мч</span>`;

function netMsg(m){return /network|NetworkError|Failed to fetch|Load failed|connection|timed out/i.test(m)?'Няма интернет. Опитай пак.':m}

/* ---------- сървър ---------- */
/* Връзка с Google Apps Script през интернет (doPost в Code.gs).
   Пращаме обикновен текст, за да няма допълнителна проверка от браузъра. */
const READS={login:1,load:1,shiftsOf:1,report:1};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* Един опит до сървъра. Връща {data} или хвърля грешка; e.retry=true, ако може да се опита пак. */
async function call1(body){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),70000);
  let r;
  try{
    r=await fetch(API,{method:'POST',redirect:'follow',signal:ctl.signal,
      headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  }catch(e){
    const x=new Error(e&&e.name==='AbortError'?'Сървърът не отговаря. Опитай пак.':'Няма интернет. Опитай пак.');x.retry=true;throw x;
  }finally{clearTimeout(tm)}
  let j;
  try{j=await r.json()}catch(e){const x=new Error('Сървърът върна грешен отговор. Провери дали внедряването е с достъп „Всеки“.');x.retry=r.status>=500;throw x}
  if(!j||!j.ok){const m=String(j&&j.error||'Грешка').replace(/^(Exception|Error|Грешка):\s*/,'');const x=new Error(netMsg(m));x.retry=m==='BUSY';throw x}
  return j.data;
}
/* Заявка с автоматично изчакване: при навалица или прекъсната връзка опитва пак сама.
   Записите носят номер (_rid), така че повторен опит никога не записва два пъти. */
async function call(action,args,p){
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(API))throw new Error('Липсва адресът на сървъра в index.html (API).');
  args=Object.assign({},args||{});
  if(!READS[action])args._rid=Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  const body={pin:p===undefined?pin:p,action,args};
  const tries=READS[action]?3:8;
  for(let n=1;;n++){
    try{const d=await call1(body);waitMsg('');return d}
    catch(e){
      if(!e.retry||n>=tries){waitMsg('');throw e.message==='BUSY'?new Error('Сървърът е много зает. Опитай пак след малко.'):e}
      waitMsg(e.message==='BUSY'?'Много хора записват в момента. Изчакай — ще се запише само.':'Връзката е слаба. Опитваме пак — изчакай.');
      await sleep(Math.min(2000*n,8000));
    }
  }
}
function waitMsg(t){const e=$('#wait');if(!e)return;e.textContent=t;e.hidden=!t}
function act(action,args,o={}){
  if(busy)return;
  setBusy(true);seq++;
  call(action,args).then(r=>{
    setBusy(false);setDb(r);allShifts={};
    if(o.ok)toast(o.ok);
    o.then?o.then():render();
  }).catch(e=>{
    setBusy(false);
    if(e.message==='AUTH'){logout('Влез отново.');return}
    const el=o.err&&$(o.err);
    if(el)el.textContent=e.message;else toast(e.message);
  });
}
function canAuto(){
  const a=document.activeElement;
  if(a&&a.matches&&a.matches('input,textarea,select'))return false;
  return !confirmKey&&(view.n==='home'||view.n==='machine');
}
function refresh(silent){
  if(!me||busy||me.role==='машинист')return;
  const s=seq;
  call('load',{}).then(r=>{
    if(s!==seq||busy)return;
    setDb(r);
    if(!silent&&view.n==='machine')delete allShifts[view.id];
    if(!silent||canAuto())render();
    if(!silent)toast('Обновено.');
  }).catch(e=>{
    if(e.message==='AUTH')logout('Влез отново.');
    else if(!silent)toast(e.message);
  });
}
setInterval(()=>{if(document.visibilityState==='visible')refresh(true)},POLL_MS);

function boot(){
  const cached=pin?loadCache():null;
  if(cached){db=cached;me=cached.me}   // показваме веднага последното, после обновяваме
  render();
  if(pin){
    const s=seq;
    call('login',{}).then(r=>{
      if(s!==seq||busy)return;          // междувременно е натиснал нещо — то вече върна нови данни
      setDb(r);
      if(!cached||canAuto())render();
    }).catch(e=>{
      if(e.message==='AUTH'){logout();return}
      if(cached){toast(e.message);return}
      loadErr=e.message;render();
    });
  }else{
    // събуждаме сървъра, докато човекът въвежда ПИН-а
    if(/^https:\/\/script\.google\.com\/.+\/exec$/.test(API))
      fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:'{"action":"ping"}'}).catch(()=>{});
  }
}

/* Проверка за голям скок: при повече от това за една смяна питаме „Сигурен ли си?“ */
const JUMP={'мч':24,'км':1500};
let jumpVal=null,jumpAgain=null;
function jumpOk(v,base,unit,sel,again){
  const lim=JUMP[unit]||JUMP['мч'];
  if(!(base>0)||v-base<=lim||jumpVal===v)return true;   // машина без показание (0) — не питаме
  jumpAgain=again;
  $(sel).innerHTML=`<div class="alert" style="font-weight:500">⚠ Това е с <b>${nf(Math.round((v-base)*10)/10)} ${esc(unit)}</b> повече от последното (${nf(base)} ${esc(unit)}). Провери цифрите на таблото.
    <div class="btns" style="margin-top:10px"><button class="btn sm danger" onclick="jumpVal=${v};jumpAgain&&jumpAgain()">Да, вярно е</button><button class="btn sm" onclick="this.closest('.alert').remove()">Ще поправя</button></div></div>`;
  return false;
}
function startShift(mid){

  if(!isNaN(v)&&!jumpOk(v,m.val||0,m.unit,'#oerr',()=>startShift(mid)))return;
  const site=$('#osite')?$('#osite').value:'';
  if(!rep&&!site&&db.sites.length){e.textContent='Избери къде е машината.';return}

function endShift(){

function sitesSummary(){
  if(!db.machines.length)return '';
  const by={};db.machines.forEach(m=>{const k=m.location||'';(by[k]=by[k]||[]).push(m)});
  const names=db.sites.map(s=>s.name);
  Object.keys(by).forEach(k=>{if(k&&!names.includes(k))names.push(k)});
  names.sort((a,b)=>(by[b]||[]).length-(by[a]||[]).length||a.localeCompare(b,'bg'));
  if(by[''])names.push('');
  return `<section class="card"><h3>Машини по обекти</h3><div class="sgrps">${names.map(n=>{
    const ms=by[n]||[],key=n||'—';
    if(!ms.length)return `<div class="sgrp-empty"><span>${esc(n)}</span><span class="cnt">няма машини</span></div>`;
    const types={};ms.forEach(m=>{(types[m.type]=types[m.type]||[]).push(m)});
    const tl=Object.keys(types).sort((a,b)=>types[b].length-types[a].length||a.localeCompare(b,'bg'));
    const chip=t=>{const st=types[t].filter(m=>m.status==='спряна').length;return `<span class="chip c-n">${esc(t)}: <b>${types[t].length}</b>${st?` <span style="color:var(--bad)">(${st} спр.)</span>`:''}</span>`};
    return `<details class="grp sgrp" data-k="${esc(key)}" ontoggle="siteTg(this)" ${openSites.has(key)?'open':''}>
      <summary><div class="sg-top"><span>${n?esc(n):'<i>Без обект</i>'}</span><span class="cnt">${ms.length} бр.</span></div>
        <div class="sumline">${tl.map(chip).join('')}</div></summary>
      ${tl.map(t=>`<div class="sg-type">${esc(t)} · ${types[t].length}</div><div class="list">${types[t].sort((a,b)=>a.num.localeCompare(b.num)).map(mRow).join('')}</div>`).join('')}
    </details>`}).join('')}</div></section>`;
}
/* ---------- ПОВРЕДИ И СПРЕНИ (ръководител и администратор) ---------- */
const openDmg=mid=>db.damages.filter(d=>d.machineId===mid&&d.status!=='поправена').sort((a,b)=>a.at-b.at);
function faultLists(){
  const withD=db.machines.filter(m=>openDmg(m.id).length);
  const stopped=db.machines.filter(m=>m.status==='спряна');
  const since=m=>{const d=openDmg(m.id)[0];return d?d.at:Infinity};
  const sort=l=>l.sort((a,b)=>since(a)-since(b)||a.num.localeCompare(b.num));   // най-отдавна повредените отгоре
  return {withD:sort(withD),stopped:sort(stopped)};
}
function faultTiles(){
  const f=faultLists();
  return `<div class="tiles">
    <button class="tile ${f.withD.length?'t-warn':''}" onclick="go('faults',{tab:'dmg'})"><span class="tn">${f.withD.length}</span><span class="tl">С повреди</span></button>
    <button class="tile ${f.stopped.length?'t-bad':''}" onclick="go('faults',{tab:'stop'})"><span class="tn">${f.stopped.length}</span><span class="tl">Спрени</span></button></div>`;
}
function daysAgo(t){const n=Math.floor((today0()-new Date(t).setHours(0,0,0,0))/864e5);return n<=0?'днес':n===1?'от вчера':`от ${n} дни`}
function today0(){const d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function faultCard(m){
  const ds=openDmg(m.id);
  return `<div class="fcard">${mRow(m)}
    ${ds.length?ds.map(d=>`<div class="ev ${d.status==='в ремонт'?'warn':'bad'}"><div class="h"><span class="chip ${DCLS[d.status]||'c-n'}">${esc(d.status)}</span><span>${fmtD(d.at)} · ${daysAgo(d.at)}</span></div>
      <div>${esc(d.text)}</div>${d.service?`<div class="small muted">Сервиз: <b style="color:var(--ink)">${esc(d.service)}</b></div>`:''}</div>`).join('')
      :`<div class="small muted" style="padding:0 4px">Няма записана повреда${isA()?' — добави я от досието.':'.'}</div>`}</div>`;
}
function faultsView(){
  const f=faultLists(),tab=view.tab==='stop'?'stop':'dmg',list=tab==='stop'?f.stopped:f.withD;
  return `<button class="back" onclick="go('home')">← Назад</button>
  <div class="segbar"><button class="${tab==='dmg'?'on':''}" onclick="view.tab='dmg';render()">С повреди · ${f.withD.length}</button><button class="${tab==='stop'?'on':''}" onclick="view.tab='stop';render()">Спрени · ${f.stopped.length}</button></div>
  <div class="small muted">${tab==='dmg'?'Машини с неотстранена повреда (повредена или в ремонт). Най-отдавна повредените са отгоре.':'Машини, отбелязани като спрени. Най-отдавна спрелите са отгоре.'}</div>
  ${list.length?`<div class="list">${list.map(faultCard).join('')}</div>`:`<div class="okbox">${tab==='dmg'?'Няма машини с повреди.':'Няма спрени машини.'}</div>`}`;
}
function mSearch(q){
  if(!q)return '';
  const r=db.machines.filter(m=>m.num.includes(q)).sort((a,b)=>a.num.localeCompare(b.num));
  return r.length?r.slice(0,20).map(mRow).join(''):'<div class="empty">Няма машина с такъв номер.</div>';
}
function mRow(m){
  const sh=openShiftOn(m.id);
  return `<button class="row" onclick="go('machine',{id:'${m.id}'})"><span class="num">${esc(m.num)}</span>
    <div class="main"><div class="t">${esc(m.type)} ${esc(m.model||'')}</div><div class="s">${esc(m.location||'—')} · <span class="mono">${nf(m.val)} ${m.unit}</span>${sh?` · ${esc(sh.user||'')}`:''}</div></div>
    <div class="stack">${stChip(m.status)}${svcChip(m)}</div></button>`;
}

/* ---------- ДОСИЕ ---------- */
function machineView(id){
  const m=M(id);if(!m)return homeView();
  const A=isA();
  const dmg=db.damages.filter(d=>d.machineId===id).sort((a,b)=>(a.status==='поправена')-(b.status==='поправена')||b.at-a.at);
  const reps=db.repairs.filter(r=>r.machineId===id).sort((a,b)=>b.at-a.at);
  const full=allShifts[id];
  if(!full&&!loadingShifts[id])setTimeout(()=>loadShifts(id));
  const lim=view.shN||SH_PAGE;
  const shs=full?full.slice(0,lim):[];
  const cur=openShiftOn(id);
  const stBtn=A?(confirmKey==='st'?`<div class="btns"><button class="btn sm ${m.status==='спряна'?'pri':'danger'}" onclick="act('setStatus',{mid:'${id}',status:'${m.status==='спряна'?'работи':'спряна'}'},{ok:'Състоянието е сменено.'})">Да, ${m.status==='спряна'?'работи':'спряна е'}</button><button class="btn sm" onclick="confirmKey=null;render()">Отказ</button></div>`
      :`<button class="btn sm" onclick="confirmKey='st';render()">${m.status==='спряна'?'Отбележи: работи':'Отбележи: спряна'}</button>`):'';
  const ask=A&&view.ask&&m.status==='спряна'?`<div class="okbox" style="display:flex;flex-direction:column;gap:10px">✓ Няма повече неотстранени повреди. Машината пак ли работи?
    <div class="btns"><button class="btn pri" onclick="view.ask=0;act('setStatus',{mid:'${id}',status:'работи'},{ok:'Отбелязано: машината работи.'})">Да, работи</button><button class="btn" onclick="view.ask=0;render()">Не, още е спряна</button></div></div>`:'';
  return `<button class="back" onclick="go('home',{type:view.type})">← Назад</button>${ask}
  <section class="card"><div class="toolbar"><div class="mhead"><span class="mnum">${esc(m.num)}</span><span class="muted">${esc(m.type)} · ${esc(m.model||'')}</span></div>${stChip(m.status)}</div>
    <div class="meter"><span class="v">${nf(m.val)}</span><span class="u">${unitL(m.unit)}</span></div>
    <dl class="kv"><dt>Къде е</dt><dd><b>${esc(m.location||'—')}</b></dd>
    ${(()=>{const s=svc(m);if(!s)return '';
      if(s.none)return `<dt>Обслужване</dt><dd><span class="muted">няма записано обслужване</span></dd>`;
      return `<dt>Обслужване</dt><dd>следващото при <b class="mono">${nf(s.next)} мч</b> · ${s.over?`<span style="color:var(--bad);font-weight:600">просрочено с ${nf(-s.left)} мч</span>`:s.due?`<span style="color:var(--warn);font-weight:600">след ${nf(s.left)} мч</span>`:`след ${nf(s.left)} мч`}</dd>`})()}
    <dt>Сега</dt><dd>${cur?`${esc(cur.user||'')}${cur.kind==='ремонт'?' (ремонт)':''}, от ${fmt(cur.startAt)}`:'Никой не е на машината'}</dd></dl>
    ${A?`<div class="btns">${stBtn}<button class="btn sm" onclick="go('machineForm',{id:'${id}'})">Промени данните</button></div>`:''}</section>

  <section class="card"><div class="toolbar"><h3>Повреди · ${dmg.length}</h3>${A?`<button class="btn sm" onclick="go('damageForm',{mid:'${id}'})">+ Повреда</button>`:''}</div>
    ${dmg.length?dmg.map(d=>`<div class="ev ${d.status==='поправена'?'ok':d.status==='в ремонт'?'warn':'bad'}"><div class="h"><span class="chip ${DCLS[d.status]||'c-n'}">${esc(d.status)}</span><span>${fmtD(d.at)}</span>${d.closedAt?`<span>поправена ${fmtD(d.closedAt)}</span>`:''}</div>
      <div>${esc(d.text)}</div>${d.service?`<div class="small muted">Сервиз: <b style="color:var(--ink)">${esc(d.service)}</b></div>`:''}
      ${A?`<button class="btn sm" style="align-self:flex-start" onclick="go('damageForm',{mid:'${id}',did:'${d.id}'})">Промени</button>`:''}</div>`).join(''):'<div class="empty">Няма записани повреди.</div>'}</section>

  <section class="card"><div class="toolbar"><h3>Ремонти и обслужване · ${reps.length}</h3>${A?`<button class="btn sm" onclick="go('repairForm',{mid:'${id}'})">+ Запис</button>`:''}</div>
    ${reps.length?reps.map(r=>`<div class="ev ok"><div class="h">${r.kind==='обслужване'?'<span class="chip c-ok">обслужване</span>':'<span class="chip c-n">ремонт</span>'}<b style="color:var(--ink)">${esc(r.service)}</b><span>${fmtD(r.at)}</span>${r.val!=null?`<span class="mono">при ${nf(r.val)} ${m.unit}</span>`:''}</div><div>${esc(r.text)}</div>
      ${A?`<button class="btn sm" style="align-self:flex-start" onclick="go('repairForm',{mid:'${id}',rid:'${r.id}'})">Промени</button>`:''}</div>`).join(''):'<div class="empty">Няма записани ремонти.</div>'}</section>

  <section class="card"><h3>Къде е била</h3>
    ${!full?'<div class="empty">Зареждане…</div>':placesHtml(id)}</section>

  <section class="card"><h3>Кой я е карал</h3>
    ${!full?'<div class="empty">Зареждане…</div>':shs.length?`<div>${shs.map(s=>shiftRow(s,m)).join('')}</div>`:'<div class="empty">Няма записани смени.</div>'}
    ${full&&full.length>lim?`<button class="btn sm" onclick="view.shN=${lim+SH_PAGE};render()">Покажи още (${full.length-lim} по-стари)</button>`:''}</section>`;
}
function placesHtml(id){
  const ev=[...(allShifts[id]||[]).filter(s=>s.site).map(s=>({t:s.startAt,site:s.site})),...(allMoves[id]||[]).map(x=>({t:x.movedAt,site:x.site,move:x.by}))]
    .filter(e=>e.t).sort((a,b)=>a.t-b.t);
  if(!ev.length)return '<div class="empty">Още няма записи. Историята се трупа от смените и преместванията.</div>';
  const runs=[];
  ev.forEach(e=>{const r=runs[runs.length-1];if(r&&r.site===e.site)r.to=e.t;else runs.push({site:e.site,from:e.t,to:e.t})});
  runs.forEach((r,i)=>{if(runs[i+1])r.until=runs[i+1].from});
  const lim=view.plN||15,list=runs.slice().reverse();
  return `<div>${list.slice(0,lim).map((r,i)=>`<div class="sh"><span class="d">${fmtD(r.from)}${i===0?' – сега':fmtD(r.to)!==fmtD(r.from)?' – '+fmtD(r.to):''}</span><span class="w">${esc(r.site)}</span><span></span></div>`).join('')}</div>
    ${list.length>lim?`<button class="btn sm" onclick="view.plN=${lim+15};render()">Покажи още (${list.length-lim})</button>`:''}`;
}
function shiftRow(s,m){
  const diff=s.startVal!=null&&s.endVal!=null?` · +${nf(Math.round((s.endVal-s.startVal)*10)/10)}`:'';
  const endTxt=s.endAt==null?'още работи':s.endVal!=null?`${nf(s.endVal)} ${m.unit}`:'?';
  const kick=s.endAt==null&&isA()?(confirmKey==='end'+s.id?` <button class="btn sm danger" onclick="act('endShift',{sid:'${s.id}'},{ok:'Смяната е приключена.'})">Да, приключи</button>`:` <button class="btn sm" onclick="confirmKey='end${s.id}';render()">Приключи</button>`):'';
  return `<div class="sh"><span class="d">${fmtD(s.startAt)}</span><span class="w">${esc(s.user||'')}</span>${s.kind==='ремонт'?'<span class="chip c-warn">ремонт</span>':'<span></span>'}
    <span class="v">${s.startVal!=null?nf(s.startVal):'—'} → ${endTxt}${diff}${kick}${isA()?` <button class="btn sm" onclick="go('shiftForm',{mid:'${m.id}',sid:'${s.id}'})">Поправи</button>`:''}</span>
    ${s.site?`<span class="x">📍 ${esc(s.site)}</span>`:''}
    ${s.auto?`<span class="x">приключена автоматично${s.endVal==null&&s.endAt!=null?' · крайното ще се попълни при следващото качване':''}</span>`:''}</div>`;
}
function loadShifts(id){
  loadingShifts[id]=true;
  call('shiftsOf',{mid:id}).then(r=>{loadingShifts[id]=false;allShifts[id]=r.shifts;allMoves[id]=r.moves||[];if(view.n==='machine'&&view.id===id&&canAuto())render()})
    .catch(e=>{loadingShifts[id]=false;allShifts[id]=[];toast(e.message);render()});
}

/* ---------- АДМИН: поправка на смяна ---------- */
function shiftForm(){
  const m=M(view.mid),s=(allShifts[view.mid]||[]).find(x=>x.id===view.sid);
  const back=`<button class="back" onclick="go('machine',{id:'${esc(view.mid)}'})">← Назад</button>`;
  if(!m||!s)return back+`<div class="empty">Смяната не е намерена. Върни се в досието и опитай пак.</div>`;
  return `${back}<section class="card"><h2>Поправи смяна</h2>
    <div class="small muted">${fmt(s.startAt)} · <b style="color:var(--ink)">${esc(s.user||'')}</b>${s.auto?' · приключена автоматично':''}</div>
    <label for="snum">Номер на машината<input id="snum" class="mono" inputmode="numeric" maxlength="5" value="${esc(s.num)}" autocomplete="off"
      oninput="this.value=this.value.replace(/\\D/g,'');const x=byNum(this.value);$('#snm').textContent=x?x.type+' '+(x.model||'')+' · '+(x.unit==='км'?'километри':'моточасове'):'—'"></label>
    <div id="snm" class="small muted">${esc(m.type)} ${esc(m.model||'')} · ${m.unit==='км'?'километри':'моточасове'}</div>
    <label for="skind">Вид<select id="skind"><option value="работа" ${s.kind!=='ремонт'?'selected':''}>Работа</option><option value="ремонт" ${s.kind==='ремонт'?'selected':''}>Помощ при ремонт</option></select></label>
    <label for="ssite">Обект<select id="ssite">${siteOptions(s.site)}</select></label>
    <label for="ssv">Начално показание<input id="ssv" class="big-in" inputmode="decimal" value="${s.startVal??''}" autocomplete="off"></label>
    ${s.endAt!=null?`<label for="sev">Крайно показание<input id="sev" class="big-in" inputmode="decimal" value="${s.endVal??''}" autocomplete="off"></label>`
      :`<div class="small muted">Смяната още не е приключена — крайното се въвежда при приключване.</div>`}
    <div class="small muted">Ако това е последната смяна на машината, показанието на машината също ще се поправи.</div>
    <div id="sferr" class="err"></div>
    <div class="btns"><button class="btn pri" onclick="saveShiftFix()">Запази</button>
      ${confirmKey==='del'?`<button class="btn danger" onclick="delShiftGo()">Да, изтрий смяната</button>`:`<button class="btn" onclick="confirmKey='del';render()">Изтрий смяната</button>`}</div></section>`;
}
function saveShiftFix(){
  const g=x=>$(x)?$(x).value.trim().replace(',','.'):'';
  const num=g('#snum'),kind=$('#skind').value,sv=g('#ssv'),ev=g('#sev'),e=$('#sferr');
  if(!byNum(num)){e.textContent='Няма машина с номер '+num+'.';return}
  if(kind==='работа'&&sv===''){e.textContent='Въведи началното показание.';return}
  if(sv!==''&&ev!==''&&Number(ev)<Number(sv)){e.textContent='Крайното не може да е по-малко от началното.';return}
  act('editShift',{sid:view.sid,num,kind,site:$('#ssite').value,startVal:sv,endVal:ev},
    {err:'#sferr',ok:'Смяната е поправена.',then:()=>{const x=byNum(num);go('machine',{id:x?x.id:view.mid})}});
}
function delShiftGo(){
  const mid=view.mid;
  act('delShift',{sid:view.sid},{err:'#sferr',ok:'Смяната е изтрита.',then:()=>go('machine',{id:mid})});
}

/* ---------- АДМИН: формуляри ---------- */
function siteOptions(cur){
  const s=db.sites.map(x=>x.name);if(cur&&!s.includes(cur))s.unshift(cur);
  return `<option value="">—</option>`+s.map(x=>`<option ${x===cur?'selected':''}>${esc(x)}</option>`).join('');
}
function machineForm(){
  const m=view.id?M(view.id):null;
  const types=[...new Set(db.machines.map(x=>x.type))];
  return `<button class="back" onclick="${m?`go('machine',{id:'${m.id}'})`:`go('home')`}">← Назад</button>
  <section class="card"><h2>${m?'Промени машина':'Нова машина'}</h2>
    <label for="fnum">Вътрешен номер (4 или 5 цифри)<input id="fnum" class="mono" inputmode="numeric" maxlength="5" value="${esc(m?.num)}" placeholder="напр. 0123" autocomplete="off"></label>
    <label for="ftype">Вид<input id="ftype" list="tl" value="${esc(m?.type)}" placeholder="напр. Багер"></label>
    <datalist id="tl">${types.map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
    <label for="fmodel">Марка и модел<input id="fmodel" value="${esc(m?.model)}" placeholder="напр. CAT 320"></label>
    <label for="funit">Отчита<select id="funit"><option value="мч" ${m?.unit!=='км'?'selected':''}>Моточасове</option><option value="км" ${m?.unit==='км'?'selected':''}>Километри</option></select></label>
    <label for="fval">Показание сега<input id="fval" class="big-in" inputmode="decimal" value="${m?m.val??'':''}" placeholder="0"></label>
    <label for="floc">Къде е<select id="floc">${siteOptions(m?.location)}</select></label>
    <label for="fst">Състояние<select id="fst"><option ${m?.status!=='спряна'?'selected':''}>работи</option><option ${m?.status==='спряна'?'selected':''}>спряна</option></select></label>
    <div id="ferr" class="err"></div><button class="btn pri" onclick="saveMachine()">Запази</button></section>`;
}
function saveMachine(){
  const g=s=>$(s).value.trim(),num=g('#fnum');
  if(!/^\d{4,5}$/.test(num)){$('#ferr').textContent='Номерът трябва да е 4 или 5 цифри.';return}
  if(!g('#ftype')){$('#ferr').textContent='Въведи вид на машината.';return}
  act('saveMachine',{id:view.id||null,num,type:g('#ftype'),model:g('#fmodel'),unit:g('#funit'),val:g('#fval').replace(',','.'),location:g('#floc'),status:g('#fst')},
    {err:'#ferr',ok:'Машината е записана.',then:()=>{const m=byNum(num);m?go('machine',{id:m.id}):go('home')}});
}
function services(){return [...new Set([...db.repairs.map(r=>r.service),...db.damages.map(d=>d.service)].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'bg'))}
function delBtn(kind,id,mid){
  return confirmKey==='del'?`<button class="btn danger" onclick="act('${kind}',{id:'${id}'},{ok:'Изтрито.',then:()=>go('machine',{id:'${mid}'})})">Да, изтрий</button>`
    :`<button class="btn" onclick="confirmKey='del';render()">Изтрий</button>`;
}
function damageForm(){
  const m=M(view.mid);if(!m)return homeView();
  const d=view.did?db.damages.find(x=>x.id===view.did):null;
  return `<button class="back" onclick="go('machine',{id:'${m.id}'})">← Назад</button>
  <section class="card"><h2>${d?'Промени повреда':'Нова повреда'}</h2>

    <label for="ddate">Дата<input id="ddate" type="date" value="${iso(d?.at)}"></label>
    <label for="dtext">Какво се е повредило<textarea id="dtext" placeholder="напр. тече хидравлично масло от стрелата">${esc(d?.text)}</textarea></label>
    <label for="dst">Статус<select id="dst">${['повредена','в ремонт','поправена'].map(s=>`<option ${(d?.status||'повредена')===s?'selected':''}>${s}</option>`).join('')}</select></label>
    <label for="dsvc">Сервиз<input id="dsvc" list="svcl" value="${esc(d?.service)}" placeholder="попълни, когато е ясен"></label>
    <datalist id="svcl">${services().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>

/* ---------- СПРАВКИ (ръководител и администратор) ---------- */
const MONTHS=['януари','февруари','март','април','май','юни','юли','август','септември','октомври','ноември','декември'];
const WD=['нд','пн','вт','ср','чт','пт','сб'];
let rep={uid:'',month:'',data:null};
function monthOpts(){const d=new Date();d.setDate(1);const o=[];for(let i=0;i<13;i++){o.push([`${d.getFullYear()}-${pad2(d.getMonth()+1)}`,`${MONTHS[d.getMonth()]} ${d.getFullYear()}`]);d.setMonth(d.getMonth()-1)}return o}
const monthLabel=v=>{const p=String(v).split('-');return `${MONTHS[+p[1]-1]} ${p[0]}`};
const diffOf=s=>s.startVal!=null&&s.endVal!=null?Math.round((s.endVal-s.startVal)*10)/10:null;
const hoursOf=s=>s.endAt&&s.startAt?Math.round((s.endAt-s.startAt)/36e5*10)/10:null;
function reportView(){
  if(!rep.month)rep.month=monthOpts()[0][0];
  const R={'машинист':0,'ръководител':1,'администратор':2};
  const us=[...db.users].sort((a,b)=>(R[a.role]-R[b.role])||a.name.localeCompare(b.name,'bg'));
  const kind=rep.kind||'person';
  return `<section class="card"><h2>Справка за месец</h2>
    <div class="segbar"><button class="${kind==='person'?'on':''}" onclick="rep.kind='person';rep.data=null;render()">По машинист</button><button class="${kind==='machine'?'on':''}" onclick="rep.kind='machine';rep.data=null;render()">По машина</button></div>
    ${kind==='person'?`<label for="ruser">Машинист<select id="ruser" onchange="rep.uid=this.value;rep.data=null;render()">
      <option value="">— избери —</option><option value="*" ${rep.uid==='*'?'selected':''}>Всички машинисти</option>
      ${us.map(u=>`<option value="${esc(u.id)}" ${u.id===rep.uid?'selected':''}>${esc(u.name)}${u.role!=='машинист'?' ('+esc(u.role)+')':''}</option>`).join('')}</select></label>`:''}
    <label for="rmonth">Месец<select id="rmonth" onchange="rep.month=this.value;rep.data=null;render()">
      ${monthOpts().map(([v,l])=>`<option value="${v}" ${v===rep.month?'selected':''}>${l}</option>`).join('')}</select></label>
    <div id="reperr" class="err"></div>
    <button class="btn pri" onclick="loadReport()">Покажи справката</button></section>
  ${rep.data?(rep.data.kind==='machine'?machineReportBody():reportBody()):''}`;
}
function loadReport(uid){
  if(busy)return;
  const mk=rep.kind==='machine'&&!uid;
  uid=mk?'*':uid||($('#ruser')?$('#ruser').value:'');const month=$('#rmonth').value;
  if(uid&&uid!=='*')rep.kind='person';
  if(!uid){$('#reperr').textContent='Избери машинист.';return}
  rep.uid=uid;rep.month=month;setBusy(true);
  call('report',{uid,month}).then(r=>{setBusy(false);r.kind=mk?'machine':'person';rep.data=r;render()}).catch(e=>{
    setBusy(false);
    if(e.message==='AUTH'){logout('Влез отново.');return}
    const el=$('#reperr');if(el)el.textContent=e.message;else toast(e.message);
  });
}
function sumUp(list){
  const t={'мч':0,'км':0},per={},days=new Set();let rd=0;
  list.forEach(s=>{
    days.add(fmtD(s.startAt));
    if(s.kind==='ремонт'){rd++;return}
    const d=diffOf(s);if(d==null)return;
    const u=s.unit||'мч';t[u]=Math.round(((t[u]||0)+d)*10)/10;
    const p=per[s.num]||(per[s.num]={num:s.num,type:s.type,model:s.model,unit:u,sum:0,n:0});p.sum=Math.round((p.sum+d)*10)/10;p.n++;
  });
  return {t,per:Object.values(per).sort((a,b)=>a.num.localeCompare(b.num)),days:days.size,n:list.length,rd};
}
function totLine(t){return [t['мч']?`<b class="mono">${nf(t['мч'])} мч</b>`:'',t['км']?`<b class="mono">${nf(t['км'])} км</b>`:''].filter(Boolean).join(' · ')||'—'}
function reportBody(){
  const d=rep.data,list=d.shifts,all=d.uid==='*';
  const who=all?'Всички машинисти':((db.users.find(u=>u.id===d.uid)||{}).name||(list[0]&&list[0].user)||'');
  const head=`<div class="toolbar"><h2>${esc(who)} · ${monthLabel(d.month)}</h2>${list.length?`<button class="btn sm" onclick="reportCsv()">⬇ Свали за Excel</button>`:''}</div>`;
  if(!list.length)return `<section class="card">${head}<div class="empty">Няма записани смени за този месец.</div></section>`;
  if(all){
    const by={};list.forEach(s=>{(by[s.userId]=by[s.userId]||{id:s.userId,name:s.user,l:[]}).l.push(s)});
    const ppl=Object.values(by).sort((a,b)=>String(a.name).localeCompare(String(b.name),'bg'));
    return `<section class="card">${head}<div class="small muted">${ppl.length} души · ${list.length} смени. Натисни човек за подробна справка.</div>
      <div class="list">${ppl.map(p=>{const x=sumUp(p.l);return `<button class="row" onclick="loadReport('${esc(p.id)}')"><div class="main"><div class="t">${esc(p.name)}</div>
        <div class="s">${x.days} дни · ${x.n} смени${x.rd?` · ${x.rd} ремонт`:''}</div></div><div class="stack">${totLine(x.t)}</div></button>`}).join('')}</div></section>`;
  }
  const x=sumUp(list);
  const byDay=[];list.forEach(s=>{const k=fmtD(s.startAt),l=byDay[byDay.length-1];if(l&&l.k===k)l.l.push(s);else byDay.push({k,t:s.startAt,l:[s]})});
  return `<section class="card">${head}
    <dl class="kv"><dt>Дни на работа</dt><dd><b>${x.days}</b> (${x.n} смени${x.rd?`, от тях ${x.rd} помощ при ремонт`:''})</dd>
      <dt>Общо</dt><dd>${totLine(x.t)}</dd></dl>
    ${x.per.length?`<h3>По машини</h3><div>${x.per.map(p=>`<div class="sh"><span class="num">${esc(p.num)}</span><span class="w">${esc(p.type)} ${esc(p.model)}</span><span class="mono">${nf(p.sum)} ${p.unit}</span><span class="x">${p.n} смени</span></div>`).join('')}</div>`:''}</section>
  <section class="card"><h3>По дни</h3>
    ${byDay.map(g=>`<div class="rday"><div class="rdh">${WD[new Date(g.t).getDay()]} ${g.k}</div>
      ${g.l.map(s=>{const df=diffOf(s),h=hoursOf(s);return `<div class="ev ${s.kind==='ремонт'?'warn':s.endAt==null?'bad':'ok'}">
        <div class="h"><span class="num">${esc(s.num)}</span><span style="color:var(--ink);font-weight:600">${esc(s.type)} ${esc(s.model)}</span>${s.kind==='ремонт'?'<span class="chip c-warn">ремонт</span>':''}</div>
        <div class="small">${fmtT(s.startAt)}–${s.endAt?fmtT(s.endAt):'…'}${h!=null?` (${nf(h)} ч)`:''}${s.site?` · 📍 ${esc(s.site)}`:''}</div>
        <div class="mono small">${s.startVal!=null?nf(s.startVal):'—'} → ${s.endVal!=null?`${nf(s.endVal)} ${esc(s.unit)}`:s.endAt==null?'още работи':'?'}${df!=null?` · <b>+${nf(df)}</b>`:''}</div>
        ${s.auto?'<div class="small muted">приключена автоматично</div>':''}</div>`}).join('')}</div>`).join('')}</section>`;
}
/* Справка по машина: колко дни е работила всяка машина и колко мч/км е изкарала. */
function machineRows(){
  const d=rep.data,[y,mo]=d.month.split('-').map(Number),now=new Date();
  const dim=new Date(y,mo,0).getDate();
  const span=(now.getFullYear()===y&&now.getMonth()+1===mo)?now.getDate():new Date(y,mo-1,1)>now?0:dim;
  const by={};d.shifts.forEach(s=>{(by[s.num]=by[s.num]||[]).push(s)});
  const rows=db.machines.map(m=>{
    const l=by[m.num]||[],work=l.filter(s=>s.kind!=='ремонт');
    let sum=0;work.forEach(s=>{const x=diffOf(s);if(x!=null)sum+=x});
    return {m,days:new Set(work.map(s=>fmtD(s.startAt))).size,rd:new Set(l.filter(s=>s.kind==='ремонт').map(s=>fmtD(s.startAt))).size,
      sum:Math.round(sum*10)/10,n:l.length};
  }).sort((a,b)=>a.days-b.days||a.m.type.localeCompare(b.m.type,'bg')||a.m.num.localeCompare(b.m.num));
  return {rows,span,dim};
}
function machineReportBody(){
  const {rows,span,dim}=machineRows(),d=rep.data;
  const idle=rows.filter(r=>!r.days).length,t={'мч':0,'км':0};
  rows.forEach(r=>{t[r.m.unit]=Math.round(((t[r.m.unit]||0)+r.sum)*10)/10});
  return `<section class="card"><div class="toolbar"><h2>Машини · ${monthLabel(d.month)}</h2>${rows.length?`<button class="btn sm" onclick="machineReportCsv()">⬇ Свали за Excel</button>`:''}</div>
    <dl class="kv"><dt>Машини</dt><dd><b>${rows.length}</b>${idle?` · <span style="color:var(--bad);font-weight:600">${idle} не са работили</span>`:''}</dd>
      <dt>Общо</dt><dd>${totLine(t)}</dd><dt>Период</dt><dd>${span} дни${span<dim?' (до днес)':''}</dd></dl>
    <div class="small muted">Най-малко работилите са отгоре. Натисни машина за досието ѝ.</div>
    <div class="list">${rows.map(r=>`<button class="row" onclick="go('machine',{id:'${r.m.id}'})"><span class="num">${esc(r.m.num)}</span>
      <div class="main"><div class="t">${esc(r.m.type)} ${esc(r.m.model||'')}</div><div class="s" style="white-space:normal">работила ${r.days} от ${span} дни · ${esc(r.m.location||'—')}</div></div>
      <div class="stack">${r.days?`<b class="mono">${nf(r.sum)} ${esc(r.m.unit)}</b>`:'<span class="chip c-bad">не е работила</span>'}${r.rd?`<span class="chip c-warn">ремонт ${r.rd} д.</span>`:''}</div></button>`).join('')}</div></section>`;
}
function downloadCsv(rows,name){
  const q=v=>{const s=String(v??'');if(/^="\d+"$/.test(s))return s;return /[;"\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const csv='﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}
const cn=v=>v==null?'':String(v).replace('.',',');
function machineReportCsv(){
  const {rows,span}=machineRows();
  downloadCsv([['Номер','Вид','Марка и модел','Обект сега','Дни работа','Дни в периода','Дни помощ при ремонт','Общо','Мярка','Смени'],
    ...rows.map(r=>[`="${r.m.num}"`,r.m.type,r.m.model,r.m.location,r.days,span,r.rd,cn(r.sum),r.m.unit,r.n])],`mashini-${rep.data.month}.csv`);
}
/* Целият машинен парк за Excel (инвентар). */
function machinesCsv(){
  const rows=[...db.machines].sort((a,b)=>a.type.localeCompare(b.type,'bg')||a.num.localeCompare(b.num)).map(m=>{
    const ds=db.damages.filter(d=>d.machineId===m.id&&d.status!=='поправена'),sv=svc(m),sh=openShiftOn(m.id);

      ds.map(d=>`${fmtD(d.at)} ${d.text} (${d.status})`).join(' | '),
      sv&&!sv.none?cn(sv.last.val):'',sv&&!sv.none?cn(sv.next):'',sv&&!sv.none?cn(sv.left):sv&&sv.none?'няма записано':'',sh?sh.user:''];
  });
  downloadCsv([['Номер','Вид','Марка и модел','Отчита','Показание','Обект','Състояние','Отворени повреди','Последно обслужване (мч)','Следващо обслужване (мч)','Остават до обслужване (мч)','Сега на машината'],...rows],
    `mashinen-park-${iso()}.csv`);
}
function reportCsv(){
  const d=rep.data;if(!d||!d.shifts.length)return;
  const q=v=>{const s=String(v??'');if(/^="\d+"$/.test(s))return s;return /[;"\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const n=v=>v==null?'':String(v).replace('.',',');
  const rows=[['Дата','Ден','Машинист','Номер','Вид','Марка и модел','Обект','Начало','Край','Часове','Начално','Крайно','Разлика','Мярка','Бележка']];
  d.shifts.forEach(s=>rows.push([fmtD(s.startAt),WD[new Date(s.startAt).getDay()],s.user,`="${s.num}"`,s.type,s.model,s.site,fmtT(s.startAt),s.endAt?fmtT(s.endAt):'',
    n(hoursOf(s)),n(s.startVal),n(s.endVal),n(diffOf(s)),s.unit,[s.kind==='ремонт'?'помощ при ремонт':'',s.auto?'приключена автоматично':'',s.endAt==null?'още работи':''].filter(Boolean).join(', ')]));
  const csv='﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
  const who=d.uid==='*'?'vsichki':String((db.users.find(u=>u.id===d.uid)||{}).name||'mashinist').replace(/[\\/:*?"<>|\s]+/g,'_');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`spravka-${d.month}-${who}.csv`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);

  <div class="list">${ss.map(s=>{const n=db.machines.filter(m=>m.location===s.name).length;
    return `<div class="row" style="cursor:default"><div class="main"><div class="t">${esc(s.name)}</div><div class="s">${n} машини там сега</div></div>
    ${confirmKey==='ds'+s.id?`<button class="btn sm danger" onclick="act('delSite',{id:'${s.id}'},{ok:'Обектът е махнат.'})">Да, махни</button>`:`<button class="btn sm" onclick="confirmKey='ds${s.id}';render()">Махни</button>`}</div>`}).join('')||'<div class="empty">Още няма обекти.</div>'}</div>`;
}
function addSite(){
  const n=$('#sname').value.trim();if(!n){$('#serr').textContent='Въведи име.';return}
  act('addSite',{name:n},{err:'#serr',ok:'Обектът е добавен.'});
}

boot();
</script>
</body>
</html>
